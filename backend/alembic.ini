
[alembic]
# A path to the alembic's script directory, relative to the current
# directory.
script_location = alembic

# Path to the env.py file, relative to the current directory.
# Leave blank for default.
# env_py_location = env.py

# A URL to connect to the database.
# The database URL is read from the application settings.
sqlalchemy.url = sqlite:///./data/ai_ensemble.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
