# Pytest configuration for running the suite from the repository root.
#
# Without this, `pytest` invoked from the repo root does not pick up the
# `asyncio_mode = "auto"` setting that lives in testing/backend/pyproject.toml,
# so every async test fails with "async def functions are not allowed without
# an async plugin" (52 failures observed). This mirrors the settings used by
# the documented runner (testing/scripts/run-tests.py) so both invocations
# behave identically.
#
# Run from the repo root:      pytest
# Run with coverage/config:    python testing/scripts/run-tests.py --coverage
#
# E2E tests are intentionally NOT collected by default: they need a running
# server plus Playwright. Use `pytest testing/backend/e2e` explicitly.

[pytest]
asyncio_mode = auto
testpaths =
    testing/backend/unit
    testing/backend/integration
pythonpath =
    backend
