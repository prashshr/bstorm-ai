apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-ensemble
  namespace: ai-ensemble
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ai-ensemble.samkhya.cloud
    secretName: ai-ensemble-tls
  rules:
  - host: ai-ensemble.samkhya.cloud
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ai-ensemble
            port:
              number: 8080
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: ai-ensemble
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-ensemble-web
            port:
              number: 80
