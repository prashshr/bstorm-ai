apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-ensemble-web-nginx
  namespace: ai-ensemble
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      client_max_body_size 100M;

      # SPA fallback: serve index.html with no-cache headers so clients instantly receive UI updates
      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
      }

      location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
      }

      # Long-cache hashed assets
      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # Proxy API and health to the backend service (defense in depth;
      # the ingress already routes these, but keep parity for direct pod access)
      location /api/ {
        proxy_pass http://ai-ensemble:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /health {
        proxy_pass http://ai-ensemble:8080;
      }

      gzip on;
      gzip_types text/css application/javascript application/json image/svg+xml;
    }
