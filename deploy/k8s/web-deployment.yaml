apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ensemble-web
  namespace: ai-ensemble
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-ensemble-web
  template:
    metadata:
      labels:
        app: ai-ensemble-web
    spec:
      containers:
      - name: web
        image: ghcr.io/prashshr/ai-ensemble-web:v4.2.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
