apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ensemble-web
  namespace: ai-ensemble
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-ensemble-web
  template:
    metadata:
      labels:
        app: ai-ensemble-web
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: web-content
        hostPath:
          path: /arbeit/ai-welt/projects/ai-ensemble/frontend/dist
          type: Directory
      - name: nginx-config
        configMap:
          name: ai-ensemble-web-nginx
