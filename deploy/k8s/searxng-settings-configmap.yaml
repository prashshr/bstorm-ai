apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: ai-ensemble
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "ai-ensemble"
      debug: false
      privacypolicy_url: false
      contact_url: false
      enable_metrics: false
    search:
      safe_search: 0
      autocomplete: ""
      formats:
        - html
        - json
    server:
      secret_key: "searxng-ai-ensemble-internal-key"
      limiter: false
      image_proxy: false
      method: "GET"
      default_http_headers:
        X-Content-Type-Options: nosniff
        X-Frame-Options: DENY
        X-XSS-Protection: 1; mode=block
    ui:
      static_use_hash: true
    redis:
      url: false
    outgoing:
      request_timeout: 10.0
      max_request_timeout: 30.0
      useragent_suffix: ""
